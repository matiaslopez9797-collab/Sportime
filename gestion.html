const SESSION_KEY = 'sportime.web.session.v1';

class ApiError extends Error {
  constructor(message, status = 0, details = null) {
    super(message);
    this.name = 'ApiError';
    this.status = status;
    this.details = details;
  }
}

function readSession() {
  try {
    const value = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return value && value.access_token && value.refresh_token ? value : null;
  } catch {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function saveSession(value) {
  if (!value) localStorage.removeItem(SESSION_KEY);
  else localStorage.setItem(SESSION_KEY, JSON.stringify(value));
}

async function parseResponse(response) {
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  const value = type.includes('application/json') ? await response.json() : await response.text();
  if (!response.ok) {
    const message = value?.msg || value?.message || value?.error_description || value?.error || String(value || `Error ${response.status}`);
    throw new ApiError(message, response.status, value);
  }
  return value;
}

class SportimeApi extends EventTarget {
  constructor() {
    super();
    this.base = CONFIG.supabaseUrl.replace(/\/$/, '');
    this.key = CONFIG.supabasePublishableKey;
    this.session = readSession();
    this.refreshPromise = null;
  }

  get user() {
    return this.session?.user || null;
  }

  setSession(session) {
    this.session = session || null;
    saveSession(this.session);
    this.dispatchEvent(new CustomEvent('session', { detail: this.session }));
  }

  async request(path, { method = 'GET', body, token = true, headers = {}, retry = true } = {}) {
    if (token) await this.ensureFreshSession();
    const authToken = token && this.session?.access_token ? this.session.access_token : this.key;
    const requestHeaders = {
      apikey: this.key,
      Authorization: `Bearer ${authToken}`,
      Accept: 'application/json',
      ...headers
    };
    if (body !== undefined && !(body instanceof Blob) && !(body instanceof FormData)) {
      requestHeaders['Content-Type'] = 'application/json';
      body = JSON.stringify(body);
    }
    const response = await fetch(`${this.base}${path}`, { method, headers: requestHeaders, body });
    if (response.status === 401 && retry && this.session?.refresh_token) {
      await this.refresh();
      return this.request(path, { method, body: body && typeof body === 'string' ? JSON.parse(body) : body, token, headers, retry: false });
    }
    return parseResponse(response);
  }

  async ensureFreshSession() {
    if (!this.session) return;
    const expiresAt = Number(this.session.expires_at || 0) * 1000;
    if (expiresAt && expiresAt - Date.now() < 60000) await this.refresh();
  }

  async refresh() {
    if (!this.session?.refresh_token) return null;
    if (this.refreshPromise) return this.refreshPromise;
    this.refreshPromise = this.request('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', token: false, retry: false, body: { refresh_token: this.session.refresh_token }
    }).then(session => {
      this.setSession(session);
      return session;
    }).catch(error => {
      if (error?.status !== 429) this.setSession(null);
      throw error;
    }).finally(() => { this.refreshPromise = null; });
    return this.refreshPromise;
  }

  async signIn(email, password) {
    const session = await this.request('/auth/v1/token?grant_type=password', {
      method: 'POST', token: false, body: { email, password }
    });
    this.setSession(session);
    return session;
  }

  async signUp(email, password, data) {
    const result = await this.request('/auth/v1/signup', {
      method: 'POST', token: false, body: { email, password, data }
    });
    if (result.access_token) this.setSession(result);
    return result;
  }

  async resetPassword(email) {
    const redirectTo = `${location.origin}${location.pathname}`;
    return this.request('/auth/v1/recover', { method: 'POST', token: false, body: { email, redirect_to: redirectTo } });
  }

  async consumeAuthCallback() {
    const raw = location.hash.startsWith('#') ? location.hash.slice(1) : '';
    const params = new URLSearchParams(raw);
    if (params.get('error_description')) throw new ApiError(params.get('error_description'));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (!accessToken || !refreshToken) return null;
    const expiresIn = Number(params.get('expires_in') || 3600);
    const session = {
      access_token: accessToken,
      refresh_token: refreshToken,
      token_type: params.get('token_type') || 'bearer',
      expires_at: Math.floor(Date.now() / 1000) + Math.max(60, expiresIn)
    };
    this.setSession(session);
    try {
      const user = await this.request('/auth/v1/user', { retry: false });
      this.setSession({ ...session, user });
    } catch (error) {
      this.setSession(null);
      throw error;
    }
    history.replaceState(null, '', `${location.pathname}${location.search}#inicio`);
    return params.get('type') || 'authenticated';
  }

  async updatePassword(password) {
    if (!this.session) throw new ApiError('El enlace de recuperación ya no es válido.');
    const user = await this.request('/auth/v1/user', { method: 'PUT', body: { password } });
    this.setSession({ ...this.session, user });
    return user;
  }

  async signOut() {
    try {
      if (this.session) await this.request('/auth/v1/logout', { method: 'POST', retry: false });
    } finally {
      this.setSession(null);
    }
  }

  async profile() {
    if (!this.user) return null;
    const rows = await this.rest('profiles', {
      query: { select: 'id,email,full_name,phone,dni,birth_date,address,role', id: `eq.${this.user.id}`, limit: '1' }
    });
    return rows[0] || null;
  }

  async rest(table, { method = 'GET', query = {}, body, prefer, token = true } = {}) {
    const params = new URLSearchParams();
    Object.entries(query).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== '') params.append(key, String(value));
    });
    const suffix = params.size ? `?${params}` : '';
    const headers = prefer ? { Prefer: prefer } : {};
    return this.request(`/rest/v1/${encodeURIComponent(table)}${suffix}`, { method, body, token, headers });
  }

  rpc(name, body = {}, { token = true } = {}) {
    if (!/^[a-z0-9_]+$/i.test(name)) throw new ApiError('Nombre de operación inválido.');
    return this.request(`/rest/v1/rpc/${name}`, { method: 'POST', body, token });
  }

  async upload(bucket, path, blob) {
    const safeBucket = encodeURIComponent(bucket);
    const safePath = path.split('/').map(encodeURIComponent).join('/');
    return this.request(`/storage/v1/object/${safeBucket}/${safePath}`, {
      method: 'POST', body: blob, headers: { 'Content-Type': blob.type, 'x-upsert': 'false' }
    });
  }

  async removeStorageObjects(bucket, paths) {
    return this.request(`/storage/v1/object/${encodeURIComponent(bucket)}`, {
      method: 'DELETE', body: { prefixes: paths }
    });
  }

  publicObjectUrl(bucket, path) {
    return `${this.base}/storage/v1/object/public/${encodeURIComponent(bucket)}/${path.split('/').map(encodeURIComponent).join('/')}`;
  }
}

function add(p){if(!p||p.stock<=0)return toast('Sin stock disponible',true);let x=cart.find(y=>y.id===p.id);if(x){if(x.qty>=x.stock)return toast('No hay más unidades',true);x.qty++}else cart.push({...p,qty:1});render()}
function modal(h){$('#modalCard').innerHTML=h;$('#modal').classList.add('show');document.querySelectorAll('.close').forEach(x=>x.onclick=close)}function close(){$('#modal').classList.remove('show')}const field=(n,l,v='',t='text',w='')=>`<div class="field ${w}"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}"></div>`;
function editStock(p){modal(`<form id="stockForm"><h2>Editar artículo y variante</h2><div class="form-grid">${field('sku','CÓDIGO',p.code)}${field('barcode','CÓDIGO DE BARRAS',p.barcode)}${field('name','DESCRIPCIÓN',p.name,'text','field-wide')}${field('brand','MARCA',p.brand)}${field('category','TIPO',p.type)}${field('unit','UNIDAD',p.unit)}${field('size','TALLE',String(p.size).split(' / ')[0])}${field('color','COLOR',String(p.size).split(' / ')[1]||'')}${field('cost','COSTO',p.cost,'number')}${field('card_price','PRECIO TARJETA',p.cardPrice,'number')}${field('transfer_price','PRECIO TRANSFERENCIA',p.transferPrice,'number')}${field('cash_price','PRECIO EFECTIVO',p.cashPrice,'number')}${field('min','STOCK MÍNIMO',p.min,'number')}${field('max','STOCK MÁXIMO',p.max,'number')}${field('stock','STOCK ACTUAL',p.stock,'number')}</div><div class="modal-actions"><button type="button" class="btn btn-secondary close">CANCELAR</button><button class="btn btn-primary">GUARDAR</button></div></form>`);$('#stockForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{await api.rpc('admin_update_sportime_product',{p_product_id:p.productId,p_product:{sku:f.sku,name:f.name,brand:f.brand,category:f.category,unit:f.unit,cost:+f.cost||0,list_price:+f.card_price||0,transfer_price:+f.transfer_price||0,cash_price:+f.cash_price||0,min_stock:+f.min||0,max_stock:+f.max||0},p_variant_id:p.id,p_variant:{barcode:f.barcode,size:f.size,color:f.color},p_target_stock:Math.max(0,parseInt(f.stock)||0),p_reason:'Edición segura desde Gestión Empresarial'});Object.assign(p,{code:f.sku,barcode:f.barcode,name:f.name,brand:f.brand,type:f.category,unit:f.unit,size:[f.size||f.unit,f.color].filter(Boolean).join(' / '),cost:+f.cost||0,cardPrice:+f.card_price||0,transferPrice:+f.transfer_price||0,cashPrice:+f.cash_price||0,price:+f.cash_price||+f.transfer_price||+f.card_price||0,min:+f.min||0,max:+f.max||0,stock:Math.max(0,parseInt(f.stock)||0)});close();render();toast('Artículo, precios y stock actualizados')}catch(x){fail(x)}}}
function partyForm(p={},type){modal(`<form id="partyForm"><h2>${p.id?'Editar':'Nuevo'} ${type==='customer'?'cliente':'proveedor'}</h2><div class="form-grid">${field('name','NOMBRE / RAZÓN SOCIAL',p.name,'text','field-wide')}${field('document_type','TIPO DOCUMENTO',p.document_type||'DNI')}${field('document_number','NÚMERO',p.document_number)}${field('tax_condition','CONDICIÓN FISCAL',p.tax_condition)}${field('phone','TELÉFONO',p.phone)}${field('email','EMAIL',p.email,'email')}${field('address','DOMICILIO',p.address,'text','field-wide')}${field('city','LOCALIDAD',p.city)}${field('province','PROVINCIA',p.province)}${field('postal_code','CÓDIGO POSTAL',p.postal_code)}${type==='supplier'?field('brands','MARCAS (separadas por coma)',(p.brands||[]).join(', ')):`<label class="check"><input name="whatsapp_consent" type="checkbox" ${p.whatsapp_consent?'checked':''}> WhatsApp autorizado</label><label class="check"><input name="email_consent" type="checkbox" ${p.email_consent?'checked':''}> Email autorizado</label>`}${field('notes','NOTAS',p.notes,'text','field-wide')}</div><div class="modal-actions"><button type="button" class="btn btn-secondary close">CANCELAR</button><button class="btn btn-primary">GUARDAR</button></div></form>`);$('#partyForm').onsubmit=async e=>{e.preventDefault();let body=Object.fromEntries(new FormData(e.target));body.party_type=type;body.brands=type==='supplier'?String(body.brands||'').split(',').map(x=>x.trim()).filter(Boolean):[];body.whatsapp_consent=!!e.target.whatsapp_consent?.checked;body.email_consent=!!e.target.email_consent?.checked;body.active=true;try{let r=await api.rest('business_parties',{method:p.id?'PATCH':'POST',query:p.id?{id:`eq.${p.id}`}:{},body,prefer:'return=representation'});parties=p.id?parties.map(x=>x.id===p.id?r[0]:x):[...parties,r[0]];close();render();toast('Registro guardado')}catch(x){fail(x)}}}
function pickCustomer(){let xs=parties.filter(x=>x.party_type==='customer');modal(`<h2>Elegir cliente</h2><div class="picker-list"><button data-c="">Consumidor final</button>${xs.map(x=>`<button data-c="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.document_number||x.phone)}</span></button>`).join('')}</div><div class="modal-actions"><button class="btn btn-secondary close">CERRAR</button></div>`);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{customer=parties.find(x=>x.id===b.dataset.c)||null;close();render()})}
function payment(){let total=cart.reduce((a,x)=>a+x.price*x.qty,0);modal(`<form id="payForm"><h2>Cobrar ${money(total)}</h2><div class="payment-grid">${[['cash','Efectivo'],['debit','Débito'],['credit','Crédito'],['transfer','Transferencia']].map((x,i)=>`<label class="payment-row"><b>${x[1]}</b><span>$</span><input name="${x[0]}" type="number" min="0" step=".01" value="${i?'':total}"></label>`).join('')}</div><div class="modal-actions"><button type="button" class="btn btn-secondary close">CANCELAR</button><button class="btn btn-primary">CONFIRMAR VENTA</button></div></form>`);$('#payForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pay=['cash','debit','credit','transfer'].map(method=>({method,amount:+f.get(method)||0})).filter(x=>x.amount>0);if(pay.reduce((a,x)=>a+x.amount,0)<total)return toast('Falta completar el importe',true);try{let r=await api.rpc('gestion_create_sale',{p_customer_id:customer?.id||null,p_items:cart.map(x=>({variant_id:x.id,quantity:x.qty,unit_price:x.price})),p_payments:pay,p_notes:null});cart.forEach(x=>products.find(p=>p.id===x.id).stock-=x.qty);sales.unshift({sale_number:r.sale_number,total:r.total,customer_name:customer?.name||'CONSUMIDOR FINAL',created_at:new Date().toISOString()});cart=[];customer=null;close();render();toast(`Venta #${r.sale_number} registrada`);window.print()}catch(x){fail(x)}}}
function buyForm(){let suppliers=parties.filter(x=>x.party_type==='supplier');buyCart=[];modal(`<form id="buyForm" class="buy-document"><div class="document-title"><div><small>COMPROBANTE DE COMPRA</small><h2>Ingreso de mercadería</h2></div><span>El stock cambia al confirmar</span></div>${suppliers.length?'':`<div class="form-alert">Primero tenés que crear un proveedor desde la sección Proveedores.</div>`}<div class="form-grid"><div class="field"><label>PROVEEDOR *</label><select name="supplier" required><option value="">Seleccionar proveedor…</option>${suppliers.map(x=>`<option value="${x.id}">${esc(x.name)}${x.brands?.length?' · '+esc(x.brands.join(', ')):''}</option>`)}</select></div><div class="field"><label>TIPO DE COMPROBANTE</label><select name="doc_type"><option>Factura</option><option>Remito</option><option>Nota de entrega</option></select></div>${field('invoice','NÚMERO DE FACTURA / REMITO')}${field('date','FECHA DE RECEPCIÓN',new Date().toISOString().slice(0,10),'date')}${field('due','VENCIMIENTO','','date')}</div><div class="buy-add"><label>AGREGAR ARTÍCULO</label><div class="search"><input id="buySearch" autofocus placeholder="Escanear código o buscar por descripción, marca o talle"></div><div id="results" class="live-results"></div></div><div class="buy-table-head"><b>Mercadería de este comprobante</b><span id="buyCount">0 artículos</span></div><div id="buyLines" class="purchase-lines empty-buy">Buscá un artículo arriba para comenzar.</div><div class="modal-actions sticky-actions"><button type="button" class="btn btn-secondary close">CANCELAR</button><button class="btn btn-primary" ${suppliers.length?'':'disabled'}>CONFIRMAR E INGRESAR STOCK</button></div></form>`);$('#buySearch').oninput=e=>showResults(e.target.value,true);$('#buyForm').onsubmit=submitBuy}
function drawBuy(){let box=$('#buyLines');box.classList.toggle('empty-buy',!buyCart.length);box.innerHTML=buyCart.map(x=>`<div><span><b>${esc(x.name)}</b><small>${esc(x.code)} · ${esc(x.brand)} · ${esc(x.size)}</small></span><label>CANTIDAD<input data-bq="${x.id}" type="number" min="1" value="${x.qty}"></label><label>COSTO UNITARIO<input data-bc="${x.id}" type="number" min="0" step=".01" value="${x.buyCost}"></label><strong>${money(x.qty*x.buyCost)}</strong><button type="button" data-br="${x.id}">×</button></div>`).join('')||'Buscá un artículo arriba para comenzar.';if($('#buyCount'))$('#buyCount').textContent=`${buyCart.length} artículo${buyCart.length===1?'':'s'} · ${money(buyCart.reduce((a,x)=>a+x.qty*x.buyCost,0))}`;document.querySelectorAll('[data-bq]').forEach(i=>i.oninput=()=>{buyCart.find(x=>x.id===i.dataset.bq).qty=Math.max(1,+i.value||1);drawBuy()});document.querySelectorAll('[data-bc]').forEach(i=>i.onchange=()=>{buyCart.find(x=>x.id===i.dataset.bc).buyCost=Math.max(0,+i.value||0);drawBuy()});document.querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{buyCart=buyCart.filter(x=>x.id!==b.dataset.br);drawBuy()})}
async function submitBuy(e){e.preventDefault();if(!buyCart.length)return toast('Agregá artículos',true);let f=new FormData(e.target);try{let r=await api.rpc('gestion_receive_purchase',{p_supplier_id:f.get('supplier'),p_invoice_number:f.get('invoice'),p_invoice_date:f.get('date')||null,p_due_date:f.get('due')||null,p_items:buyCart.map(x=>({variant_id:x.id,quantity:x.qty,unit_cost:x.buyCost})),p_notes:null});buyCart.forEach(x=>{let p=products.find(p=>p.id===x.id);p.stock+=x.qty;p.cost=x.buyCost});purchases.unshift({purchase_number:r.purchase_number,invoice_date:f.get('date'),invoice_number:f.get('invoice'),total:r.total,business_parties:{name:parties.find(x=>x.id===f.get('supplier'))?.name}});close();render();toast(`Compra #${r.purchase_number} recibida`)}catch(x){fail(x)}}
function showResults(q,buy=false){q=q.trim().toLowerCase();let box=$('#results');if(!q)return box.innerHTML='';let xs=products.filter(p=>(buy||p.stock>0)&&(p.code+' '+p.barcode+' '+p.name+' '+p.brand+' '+p.size).toLowerCase().includes(q)).slice(0,30);box.innerHTML=xs.map(p=>`<button type="button" data-add="${p.id}"><b>${esc(p.name)}</b><span>${esc(p.code)} · ${esc(p.size)} · Stock ${p.stock}</span><strong>${money(p.price)}</strong></button>`).join('')||'<p>Sin resultados.</p>';box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.add);if(buy){if(!buyCart.some(x=>x.id===p.id))buyCart.push({...p,qty:1,buyCost:p.cost||0});drawBuy()}else add(p)})}
function csv(rows,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download=name;a.click()}

payment=function(){let total=cart.reduce((a,x)=>a+x.price*x.qty,0);modal(`<form id="payForm"><h2>Cobrar ${money(total)}</h2><p class="muted">Cliente: ${esc(customer?.name||'CONSUMIDOR FINAL')}</p><div class="payment-grid">${[['cash','Efectivo'],['debit','Débito'],['credit','Crédito'],['transfer','Transferencia']].map((x,i)=>`<label class="payment-row"><b>${x[1]}</b><span>$</span><input name="${x[0]}" type="number" min="0" step=".01" value="${i?'':total}"></label>`).join('')}</div><div class="fiscal-note">Esta operación emite un comprobante interno Sportime. La factura fiscal ARCA requiere la integración tributaria.</div><div class="modal-actions"><button type="button" class="btn btn-secondary close">CANCELAR</button><button class="btn btn-primary">CONFIRMAR VENTA</button></div></form>`);$('#payForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pay=['cash','debit','credit','transfer'].map(method=>({method,amount:+f.get(method)||0})).filter(x=>x.amount>0);if(pay.reduce((a,x)=>a+x.amount,0)<total)return toast('Falta completar el importe',true);let sold=cart.map(x=>({...x})),soldCustomer=customer;try{let r=await api.rpc('gestion_create_sale',{p_customer_id:customer?.id||null,p_items:cart.map(x=>({variant_id:x.id,quantity:x.qty,unit_price:x.price})),p_payments:pay,p_notes:`Sucursal: ${activeBranch==='principal'?'Principal':locations.find(x=>x.id===activeBranch)?.name||'Móvil'}`});cart.forEach(x=>products.find(p=>p.id===x.id).stock-=x.qty);sales.unshift({sale_number:r.sale_number,total:r.total,customer_name:customer?.name||'CONSUMIDOR FINAL',created_at:new Date().toISOString()});cart=[];customer=null;receiptView(r,sold,pay,soldCustomer);toast(`Venta #${r.sale_number} registrada`)}catch(x){fail(x)}}}
const baseEditStock=editStock;editStock=function(p){baseEditStock(p);let input=document.querySelector('#stockForm input[name="barcode"]'),box=input?.closest('.field');if(!box)return;let actions=document.createElement('div');actions.className='barcode-actions';actions.innerHTML='<button type="button" class="btn btn-primary" id="generateBarcode">GENERAR EAN-13</button><button type="button" class="btn btn-secondary" id="printBarcode">IMPRIMIR ETIQUETA 55 × 35</button>';box.append(actions);let preview=document.createElement('div');preview.className='ean-preview';if(validEan(input.value))preview.innerHTML=eanSvg(input.value);box.after(preview);$('#generateBarcode').onclick=()=>{input.value=generateEan();preview.innerHTML=eanSvg(input.value);toast('Código EAN-13 generado')};$('#printBarcode').onclick=()=>printLabel(p,input.value);input.addEventListener('input',()=>preview.innerHTML=validEan(input.value)?eanSvg(input.value):'');$('#stockForm').addEventListener('submit',e=>{let code=input.value.trim(),dup=products.find(x=>x.barcode===code&&x.id!==p.id);if(dup){e.preventDefault();e.stopImmediatePropagation();return toast(`El código ya pertenece a ${dup.name}`,true)}if(/^\d{13}$/.test(code)&&!validEan(code)){e.preventDefault();e.stopImmediatePropagation();toast('El EAN-13 tiene un dígito verificador incorrecto',true)}},true)}
const gestionRest=api.rest.bind(api);api.rest=(table,options={})=>{let next={...options};if(next.body&&['products','product_variants'].includes(table)){next.body={...next.body};if(table==='products'&&['active','inactive'].includes(next.body.status)){next.body.active=next.body.status==='active';next.body.status=next.body.active?'published':'hidden'}if(next.method==='POST'&&!next.body.source_id)next.body.source_id=`WEB-${table==='products'?'P':'V'}-${crypto.randomUUID()}`;return gestionRest(table,next)}return gestionRest(table,options)};
function selectBranch(id){activeBranch=id||'principal';localStorage.setItem('sportime.active.branch',activeBranch);let select=$('#branchSelect');if(select)select.value=activeBranch;toast(`Sucursal activa: ${activeBranch==='principal'?'Principal':locations.find(x=>x.id===activeBranch)?.name||'Local móvil'}`)}
async function updateLocationStatus(id,status){let x=locations.find(item=>item.id===id);if(!x)return;let label=status==='active'?'abrir/activar':status==='closed'?'cerrar':'pausar';if(!confirm(`¿Querés ${label} la sucursal ${x.name}?`))return;try{let r=await api.rpc('pc_upsert_mobile_location',{p_location:{source_id:x.source_id,name:x.name,location:x.location||'',responsible:x.responsible||'',event_date:x.event_date||'',status,closed_at:status==='closed'?new Date().toISOString():null},p_lines:[]});x.status=r.status||status;if(status!=='active'&&activeBranch===id)selectBranch('principal');render();toast(`Sucursal ${status==='active'?'abierta y activa':status==='closed'?'cerrada':'pausada'}`)}catch(error){fail(error)}}
function filteredStock(){let q=($('#stockSearch')?.value||'').toLowerCase(),xs=products.filter(p=>(p.code+' '+p.barcode+' '+p.name+' '+p.brand+' '+p.type).toLowerCase().includes(q));if(stockFilter==='available')xs=xs.filter(p=>p.stock>0);if(stockFilter==='low')xs=xs.filter(p=>p.stock>0&&p.stock<=p.min);if(stockFilter==='empty')xs=xs.filter(p=>p.stock<=0);return xs}
function wireExtras(){if($('#importStock'))$('#importStock').onclick=()=>$('#excelFile').click();if($('#excelFile'))$('#excelFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{await importExcel(f)}catch(x){fail(x)}finally{e.target.value=''}};if($('#exportStock'))$('#exportStock').onclick=exportExcel;document.querySelectorAll('[data-stock-filter]').forEach(b=>b.onclick=()=>{stockFilter=b.dataset.stockFilter;document.querySelectorAll('[data-stock-filter]').forEach(x=>x.classList.toggle('active',x===b));$('#stockRows').innerHTML=stockRows(filteredStock());wire();wireExtras()});document.querySelectorAll('[data-use-branch]').forEach(b=>b.onclick=()=>selectBranch(b.dataset.useBranch));document.querySelectorAll('[data-location-status]').forEach(b=>b.onclick=()=>updateLocationStatus(b.dataset.locationStatus,b.dataset.nextStatus));if(page==='locations'){let h=$('#content .hero');if(h&&!$('#newLocation')){let b=document.createElement('button');b.id='newLocation';b.className='btn btn-primary';b.textContent='+ NUEVA SUCURSAL MÓVIL';b.onclick=newLocation;h.append(b)}}if(page==='pos'){let a=document.querySelectorAll('.sale-actions button');if(a[0])a[0].onclick=()=>{if(!cart.length||confirm('¿Cancelar la venta actual y comenzar otra?')){cart=[];customer=null;render()}};if(a[1])a[1].onclick=budgetView;if(a[2])a[2].onclick=cashMovements}}
$('#content').addEventListener('click',e=>{let r=e.target.closest('[data-stock-id]');if(!r||e.target.closest('button'))return;selectedStockId=r.dataset.stockId;document.querySelectorAll('[data-stock-id]').forEach(x=>x.classList.toggle('selected',x.dataset.stockId===selectedStockId))});
$('#content').addEventListener('dblclick',e=>{let r=e.target.closest('[data-stock-id]');if(!r||e.target.closest('button'))return;editStock(products.find(x=>x.id===r.dataset.stockId))});
$('#content').addEventListener('input',e=>{if(e.target.id==='stockSearch')queueMicrotask(wireExtras)});
let branchSelect=$('#branchSelect');branchSelect.innerHTML='<option value="principal">Principal</option>'+locations.map(x=>`<option value="${x.id}">${esc(x.name||'Local móvil')} · ${esc(x.status||'')}</option>`).join('');if(activeBranch!=='principal'&&!locations.some(x=>x.id===activeBranch))activeBranch='principal';branchSelect.value=activeBranch;branchSelect.onchange=e=>selectBranch(e.target.value);
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#syncBtn').onclick=()=>location.reload();$('#modal').onclick=e=>{if(e.target.id==='modal')close()};window.addEventListener('keydown',e=>{if(e.key==='F9'&&page==='pos'&&cart.length){e.preventDefault();payment()}if(e.key==='Escape')close()});if(d.profile){$('#session-user').textContent=d.profile.email||d.profile.full_name;$('#avatar').textContent=(d.profile.full_name||d.profile.email||'ST').split(/\s|@/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}nav();render();

}
    }
  }
} catch (error) {
  const message = error?.status === 429 ? 'Supabase limitó temporalmente las solicitudes. Esperá unos minutos y actualizá una sola vez.' : 'No pudimos validar el acceso. Revisá la conexión e intentá nuevamente.';
  block('No se pudo abrir Gestión', message, 'VOLVER A LA TIENDA', './#inicio');
}
