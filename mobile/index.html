<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Sportime · Local móvil</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--green:#8cff00;--black:#080808;--muted:#68707b;--line:#e3e7eb;--danger:#d92d20;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7f9;color:#111}.hide{display:none!important}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--black);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;font-size:24px;font-style:italic}.brand span{color:var(--green)}.pending{border-radius:999px;background:#26303a;padding:7px 10px;font-size:12px;font-weight:800}.pending.warn{background:var(--warn);color:#111}.wrap{max-width:720px;margin:auto;padding:16px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 7px 20px rgba(0,0,0,.05)}h1,h2,h3,p{margin-top:0}.field{display:block;font-weight:800;margin:12px 0 6px}.input{width:100%;padding:14px;border:1px solid #cfd5db;border-radius:12px;background:#fff}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:950;background:#111;color:#fff;margin-top:10px}.btn.green{background:var(--green);color:#080808}.btn.light{background:#eef1f4;color:#111}.btn.danger{background:#fee4e2;color:#b42318}.status{font-size:13px;color:var(--muted)}.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode button{border:1px solid var(--line);background:#fff;padding:14px;border-radius:13px;font-weight:900}.mode button.on{background:#111;color:#fff;border-color:#111}.scan{display:grid;grid-template-columns:1fr 112px;gap:9px}.scan button{margin:0}.video-wrap{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;overflow:hidden}.video-wrap video{width:100%;height:calc(100% - 82px);object-fit:cover}.scan-line{position:absolute;z-index:52;left:7%;right:7%;top:16%;height:3px;border-radius:3px;background:#ff2525;box-shadow:0 0 5px #fff,0 0 12px #ff2525,0 0 24px #ff2525;animation:scanBeam 1.8s ease-in-out infinite;pointer-events:none}.scan-line:before,.scan-line:after{content:"";position:absolute;top:-8px;width:2px;height:19px;background:#ff2525}.scan-line:before{left:0}.scan-line:after{right:0}@keyframes scanBeam{0%,100%{top:16%;opacity:.8}50%{top:72%;opacity:1}}.video-actions{height:82px;background:#111;padding:12px;z-index:53}.product-title{font-size:22px;font-weight:1000}.price{font-size:30px;font-weight:1000}.cash{font-size:17px;color:#278600;font-weight:900}.stock{display:inline-block;background:#edf9e7;padding:7px 10px;border-radius:999px;font-weight:900}.stock.low{background:#fff1d6;color:#9a5b00}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#111;color:#fff;font-size:20px}.total{display:flex;justify-content:space-between;font-size:24px;font-weight:1000;padding:15px 0}.payments{display:grid;grid-template-columns:1fr 1fr;gap:8px}.payments button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;font-weight:900}.payments button.on{background:#111;color:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}.bottom button{margin:0}.toast{position:fixed;left:16px;right:16px;bottom:94px;background:#111;color:#fff;border-radius:14px;padding:14px;z-index:80;text-align:center;font-weight:800}.receipt{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;padding:20px;overflow:auto}.receipt-box{background:#fff;max-width:420px;margin:auto;border-radius:20px;padding:20px}.receipt-head{text-align:center;border-bottom:2px dashed #111;padding-bottom:12px}.receipt-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.receipt small{color:#555}@media(min-width:650px){.wrap{padding-top:24px}.bottom{left:50%;transform:translateX(-50%);max-width:720px;border:1px solid var(--line);border-radius:16px 16px 0 0}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">SPORT<span>TIME</span></div><div id="netState" class="pending">CONECTANDO</div></header>
  <main class="wrap">
    <section id="loginView" class="card">
      <h1>Local móvil</h1><p class="status">Ingresá con el usuario autorizado para vender.</p>
      <label class="field">Correo</label><input id="email" class="input" type="email" autocomplete="username">
      <label class="field">Contraseña</label><input id="password" class="input" type="password" autocomplete="current-password">
      <button id="loginBtn" class="btn green">INGRESAR</button>
    </section>

    <section id="locationView" class="card hide">
      <h2>Elegir local</h2><select id="locationSelect" class="input"></select>
      <button id="openLocation" class="btn green">ABRIR PUNTO DE VENTA</button>
      <button id="logoutBtn" class="btn light">CERRAR SESIÓN</button>
    </section>

    <section id="saleView" class="hide">
      <div class="card"><div class="status">LOCAL ACTIVO</div><h2 id="locationName">—</h2><div id="locationAddress" class="status"></div></div>
      <div class="mode"><button id="modeQuery" class="on">CONSULTA</button><button id="modeSale">VENTA</button></div>
      <div class="card" style="margin-top:14px">
        <div class="scan"><input id="barcode" class="input" inputmode="search" placeholder="Código o descripción"><button id="scanBtn" class="btn green">ESCANEAR</button></div>
        <button id="searchBtn" class="btn light">BUSCAR ARTÍCULO</button>
      </div>
      <div id="productCard" class="card hide"></div>
      <div id="resultsCard" class="card hide"></div>
      <div id="cartCard" class="card hide"><h2>Venta</h2><div id="cartLines"></div><div class="total"><span>Total</span><span id="cartTotal">$ 0</span></div><div class="payments" id="payments"><button class="on">EFECTIVO</button><button>TRANSFERENCIA</button><button>DÉBITO</button><button>CRÉDITO</button></div><button id="finishBtn" class="btn green">COBRAR Y FINALIZAR</button><button id="clearBtn" class="btn danger">CANCELAR VENTA</button></div>
    </section>
  </main>

  <div id="camera" class="video-wrap hide"><video id="video"></video><div class="scan-line" aria-hidden="true"></div><div class="video-actions"><button id="closeCamera" class="btn light">CERRAR CÁMARA</button></div></div>
  <div id="receipt" class="receipt hide"><div class="receipt-box"><div class="receipt-head"><div class="brand" style="color:#111">SPORT<span>TIME</span></div><b>COMPROBANTE DE VENTA NO FISCAL</b></div><div id="receiptBody"></div><button id="shareReceipt" class="btn green">COMPARTIR / WHATSAPP</button><button id="printReceipt" class="btn light">IMPRIMIR</button><button id="closeReceipt" class="btn">NUEVA VENTA</button></div></div>
  <nav id="bottomBar" class="bottom hide"><button id="backLocations" class="btn light">CAMBIAR LOCAL</button><button id="cartBtn" class="btn green">VENTA · <span id="cartCount">0</span></button></nav>
  <div id="toast" class="toast hide"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script>
  (()=>{
    const URL='https://yvelpgtmmrkiewogumtd.supabase.co';
    const KEY='sb_publishable_db5RisvSFhyoSwcsqLwK9w_TvysPb9P';
    const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
    let locations=[],location=null,catalog=[],cart=[],mode='query',payment='EFECTIVO',scanner=null,lastReceipt=null;
    const queue=()=>JSON.parse(localStorage.getItem('sportime_mobile_queue')||'[]');
    const saveQueue=q=>{localStorage.setItem('sportime_mobile_queue',JSON.stringify(q));updateNet()};
    const cacheKey=()=>location?'sportime_catalog_'+location.id:'';
    function toast(message){$('toast').textContent=message;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2600)}
    function updateNet(){const pending=queue().length,navigatorOnline=navigator.onLine;$('netState').textContent=navigatorOnline?(pending?'PENDIENTES: '+pending:'EN LÍNEA'):'SIN INTERNET · '+pending+' PEND.';$('netState').classList.toggle('warn',!navigatorOnline||pending>0)}
    function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
    function show(view){['loginView','locationView','saleView'].forEach(id=>$(id).classList.toggle('hide',id!==view));$('bottomBar').classList.toggle('hide',view!=='saleView')}
    async function boot(){updateNet();const {data}=await db.auth.getSession();if(data.session)await loadLocations();else show('loginView');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});syncQueue()}
    async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('Completá correo y contraseña');$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error)return toast(error.message);$('password').value='';await loadLocations()}
    async function loadLocations(){const {data,error}=await db.rpc('mobile_my_locations');if(error){show('loginView');return toast('Sin acceso: '+error.message)}locations=data||[];$('locationSelect').innerHTML=locations.map(l=>`<option value="${l.id}">${escapeHtml(l.name)}${l.location?' · '+escapeHtml(l.location):''}</option>`).join('');show('locationView');if(!locations.length)toast('Todavía no hay locales móviles activos')}
    async function openLocation(){location=locations.find(x=>x.id===$('locationSelect').value);if(!location)return;await loadCatalog();$('locationName').textContent=location.name;$('locationAddress').textContent=location.location||'';cart=[];renderCart();show('saleView')}
    async function loadCatalog(){if(navigator.onLine){const {data,error}=await db.rpc('mobile_location_catalog',{p_location_id:location.id});if(!error){catalog=Array.isArray(data)?data:[];localStorage.setItem(cacheKey(),JSON.stringify(catalog));return}}catalog=JSON.parse(localStorage.getItem(cacheKey())||'[]');if(!catalog.length)toast('No hay catálogo guardado para trabajar sin conexión')}
    function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function findProducts(q){q=String(q||'').trim().toLowerCase();if(!q)return[];const exact=catalog.find(p=>String(p.barcode||'').toLowerCase()===q||String(p.sku||'').toLowerCase()===q);if(exact)return[exact];return catalog.filter(p=>[p.name,p.variant_name,p.color,p.barcode,p.sku].join(' ').toLowerCase().includes(q)).slice(0,20)}
    function search(){const list=findProducts($('barcode').value);if(!list.length){beep(false);return toast('Artículo no encontrado en este local')}if(list.length===1){selectProduct(list[0]);return}$('resultsCard').innerHTML='<h3>Resultados</h3>'+list.map((p,i)=>`<button class="btn light" data-result="${i}">${escapeHtml(p.name)} · ${escapeHtml(p.variant_name||'Único')}<br><small>${money(p.list_price)} · Stock ${p.stock}</small></button>`).join('');$('resultsCard').classList.remove('hide');[...$('resultsCard').querySelectorAll('[data-result]')].forEach(b=>b.onclick=()=>selectProduct(list[Number(b.dataset.result)]))}
    function selectProduct(p){$('resultsCard').classList.add('hide');$('barcode').value='';$('productCard').innerHTML=`<div class="product-title">${escapeHtml(p.name)}</div><div class="status">${escapeHtml(p.variant_name||'Único')}${p.color?' · '+escapeHtml(p.color):''}<br>Código: ${escapeHtml(p.barcode||p.sku||'—')}</div><div class="price">${money(p.list_price)}</div>${Number(p.cash_price)>0&&Number(p.cash_price)!==Number(p.list_price)?`<div class="cash">Efectivo ${money(p.cash_price)}</div>`:''}<p><span class="stock ${Number(p.stock)<=2?'low':''}">Stock local: ${p.stock}</span></p>${mode==='sale'?`<button id="addSelected" class="btn green">AGREGAR A LA VENTA</button>`:'<button id="startSale" class="btn green">VENDER ESTE ARTÍCULO</button>'}`;$('productCard').classList.remove('hide');const add=$('addSelected')||$('startSale');add.onclick=()=>{setMode('sale');addToCart(p)}}
    function addToCart(p){const found=cart.find(x=>x.variant_source_id===p.variant_source_id);const current=found?found.quantity:0;if(current>=Number(p.stock)&&navigator.onLine)return toast('No hay más stock disponible');if(found)found.quantity++;else cart.push({...p,quantity:1});beep(true);renderCart();$('productCard').classList.add('hide');toast('Agregado a la venta')}
    const salePrice=x=>payment==='EFECTIVO'&&Number(x.cash_price)>0?Number(x.cash_price):Number(x.list_price);
    function renderCart(){const total=cart.reduce((a,x)=>a+salePrice(x)*x.quantity,0);$('cartCount').textContent=cart.reduce((a,x)=>a+x.quantity,0);$('cartCard').classList.toggle('hide',!cart.length);$('cartLines').innerHTML=cart.map((x,i)=>`<div class="cart-line"><div><b>${escapeHtml(x.name)}</b><div class="status">${escapeHtml(x.variant_name||'Único')} · ${money(salePrice(x))}</div></div><div class="qty"><button data-minus="${i}">−</button><b>${x.quantity}</b><button data-plus="${i}">+</button></div></div>`).join('');$('cartTotal').textContent=money(total);[...document.querySelectorAll('[data-minus]')].forEach(b=>b.onclick=()=>changeQty(Number(b.dataset.minus),-1));[...document.querySelectorAll('[data-plus]')].forEach(b=>b.onclick=()=>changeQty(Number(b.dataset.plus),1))}
    function changeQty(i,d){cart[i].quantity+=d;if(cart[i].quantity<=0)cart.splice(i,1);renderCart()}
    function setMode(next){mode=next;$('modeQuery').classList.toggle('on',next==='query');$('modeSale').classList.toggle('on',next==='sale');if(next==='sale'&&cart.length)$('cartCard').scrollIntoView({behavior:'smooth'})}
    async function finishSale(){if(!cart.length)return;const session=(await db.auth.getSession()).data.session;const total=cart.reduce((a,x)=>a+salePrice(x)*x.quantity,0),operation={operation_id:uuid(),location_id:location.id,location_name:location.name,created_at:new Date().toISOString(),seller_name:session?.user?.email||'',items:cart.map(x=>({variant_source_id:x.variant_source_id,quantity:x.quantity,description:x.name,unit_price:salePrice(x)})),payments:[{method:payment,amount:total}],total};$('finishBtn').disabled=true;let result=null,synced=false;try{if(!navigator.onLine)throw new TypeError('offline');const {data,error}=await db.rpc('mobile_place_sale',{p_operation_id:operation.operation_id,p_location_id:operation.location_id,p_items:operation.items,p_payments:operation.payments,p_seller_name:operation.seller_name,p_client_created_at:operation.created_at});if(error)throw error;result=data;synced=true}catch(e){if(navigator.onLine&&!(e instanceof TypeError)){toast(e.message||'No se pudo registrar');$('finishBtn').disabled=false;return}const q=queue();q.push(operation);saveQueue(q);result={receipt_number:'PEND-'+operation.operation_id.slice(0,8),total,status:'pending'}}cart.forEach(line=>{const p=catalog.find(x=>x.variant_source_id===line.variant_source_id);if(p)p.stock=Number(p.stock)-line.quantity});localStorage.setItem(cacheKey(),JSON.stringify(catalog));lastReceipt={...operation,receipt_number:result.receipt_number,status:result.status,synced};cart=[];renderCart();$('finishBtn').disabled=false;showReceipt(lastReceipt);updateNet()}
    function showReceipt(r){$('receiptBody').innerHTML=`<div class="receipt-row"><span>Número</span><b>${escapeHtml(r.receipt_number)}</b></div><div class="receipt-row"><span>Fecha</span><b>${new Date(r.created_at).toLocaleString('es-AR')}</b></div><div class="receipt-row"><span>Local</span><b>${escapeHtml(r.location_name)}</b></div>${r.items.map(x=>`<div class="receipt-row"><span>${x.quantity} × ${escapeHtml(x.description)}</span><b>${money(x.quantity*x.unit_price)}</b></div>`).join('')}<hr><div class="receipt-row"><strong>TOTAL</strong><strong>${money(r.total)}</strong></div><div class="receipt-row"><span>Pago</span><b>${escapeHtml(r.payments[0].method)}</b></div><p class="status">${r.synced?'Venta sincronizada':'Venta guardada en el teléfono. Se enviará automáticamente al recuperar Internet.'}</p>`;$('receipt').classList.remove('hide')}
    async function syncQueue(){if(!navigator.onLine)return updateNet();const q=queue();if(!q.length)return updateNet();const remaining=[];for(const op of q){try{const {error}=await db.rpc('mobile_place_sale',{p_operation_id:op.operation_id,p_location_id:op.location_id,p_items:op.items,p_payments:op.payments,p_seller_name:op.seller_name,p_client_created_at:op.created_at});if(error)throw error}catch(e){remaining.push(op)}}saveQueue(remaining);if(remaining.length<q.length){toast((q.length-remaining.length)+' venta(s) sincronizada(s)');if(location)await loadCatalog()}updateNet()}
    async function startCamera(){if(!window.ZXing)return toast('El lector no está disponible. Ingresá el código manualmente.');$('camera').classList.remove('hide');try{const reader=new ZXing.BrowserMultiFormatReader();scanner=reader;await reader.decodeFromVideoDevice(null,$('video'),(result)=>{if(result){$('barcode').value=result.getText();stopCamera();navigator.vibrate?.(80);search()}})}catch(e){stopCamera();toast('No se pudo abrir la cámara. Revisá el permiso.') }}
    function stopCamera(){try{scanner?.reset()}catch{}scanner=null;$('camera').classList.add('hide')}
    function beep(ok){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?880:220;g.gain.value=.06;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08)}catch{}}
    function receiptText(r){return `SPORTIME\nCOMPROBANTE DE VENTA NO FISCAL\n${r.receipt_number}\n${r.location_name}\n${r.items.map(x=>`${x.quantity} x ${x.description} ${money(x.quantity*x.unit_price)}`).join('\n')}\nTOTAL ${money(r.total)}\nPago: ${r.payments[0].method}`}
    $('loginBtn').onclick=login;$('openLocation').onclick=openLocation;$('logoutBtn').onclick=async()=>{await db.auth.signOut();show('loginView')};$('searchBtn').onclick=search;$('barcode').onkeydown=e=>{if(e.key==='Enter')search()};$('scanBtn').onclick=startCamera;$('closeCamera').onclick=stopCamera;$('modeQuery').onclick=()=>setMode('query');$('modeSale').onclick=()=>setMode('sale');$('cartBtn').onclick=()=>{setMode('sale');$('cartCard').scrollIntoView({behavior:'smooth'})};$('clearBtn').onclick=()=>{cart=[];renderCart()};$('finishBtn').onclick=finishSale;$('backLocations').onclick=()=>show('locationView');[...$('payments').children].forEach(b=>b.onclick=()=>{payment=b.textContent;[...$('payments').children].forEach(x=>x.classList.toggle('on',x===b));renderCart()});$('closeReceipt').onclick=()=>{$('receipt').classList.add('hide');setMode('query')};$('printReceipt').onclick=()=>window.print();$('shareReceipt').onclick=async()=>{const text=receiptText(lastReceipt);if(navigator.share)await navigator.share({title:'Comprobante Sportime',text});else window.location.href='https://wa.me/?text='+encodeURIComponent(text)};window.addEventListener('online',syncQueue);window.addEventListener('offline',updateNet);setInterval(syncQueue,30000);setInterval(()=>{if(location&&navigator.onLine&&queue().length===0)loadCatalog()},20000);boot();
  })();
  </script>
</body>
</html>
